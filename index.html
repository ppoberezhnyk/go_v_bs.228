<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Питання для тебе</title>
    <style>
        body {
            background: #ffecb3;
            font-family: 'Arial', sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 { color: #5d4037; }

        .cats { font-size: 80px; margin-bottom: 20px; }

        .container { position: relative; width: 100%; height: 150px; }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            position: absolute;
            transition: all 0.1s ease; /* швидка реакція */
        }

        #yesBtn { background: #81c784; left: 35%; }
        #noBtn { background: #e57373; left: 55%; }
    </style>
</head>
<body>

    <div class="cats">🐱 🐱</div>
    <h1>Ти сьогодні вільний?</h1>
    
    <div class="container">
        <button id="yesBtn" onclick="sayYes()">Так</button>
        <button id="noBtn" onmouseover="moveButton()" onmousedown="moveButton()">Ні</button>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            // Випадкові координати
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function sayYes() {
            alert('Добре! Чекаю на твій дзвінок о 14:00!');
        }
    </script>
</body>
</html>
